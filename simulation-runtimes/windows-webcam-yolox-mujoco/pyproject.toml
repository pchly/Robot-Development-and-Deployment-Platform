[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robot-windows-webcam-yolox-mujoco-runtime"
version = "0.2.0"
description = "Windows webcam and YOLOX ONNX Runtime frontend for the MuJoCo arm"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.0,<3",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93"
]

[tool.hatch.build.targets.wheel]
packages = ["src/robot_windows_webcam_yolox_mujoco"]

[tool.hatch.build.targets.wheel.force-include]
"models/yolox_nano.onnx" = "robot_windows_webcam_yolox_mujoco/models/yolox_nano.onnx"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
