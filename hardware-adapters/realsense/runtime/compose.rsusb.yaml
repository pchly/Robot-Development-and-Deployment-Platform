name: robot-platform-realsense-validation

services:
  realsense-probe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${REALSENSE_BASE_IMAGE:-ubuntu:22.04}"
        LIBREALSENSE_VERSION: v2.58.4
        FORCE_RSUSB_BACKEND: "ON"
    image: robot-platform/realsense-runtime:0.1.0-rsusb
    network_mode: none
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rw"
