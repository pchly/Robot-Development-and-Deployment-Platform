name: robot-development-platform

services:
  platform-api:
    build:
      context: ./services/platform-api
    ports:
      - "${PLATFORM_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  edge-agent:
    build:
      context: ./services/edge-agent
    command:
      - --server-url
      - http://platform-api:8000
      - --agent-id
      - edge-compose-01
      - --name
      - Compose模拟节点
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  studio:
    build:
      context: ./apps/studio
    ports:
      - "${STUDIO_PORT:-5173}:80"
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

